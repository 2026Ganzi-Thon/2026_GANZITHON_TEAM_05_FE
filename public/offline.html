<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Letit 레딧</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        padding: 25px;
        background: #ffffff;
        color: #303a50;
        font-family:
          'Pretendard Variable',
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        text-align: center;
      }
      main {
        width: 100%;
        max-width: 352px;
      }
      h1 {
        margin-bottom: 15px;
        font-size: 20px;
        font-weight: 700;
      }
      p {
        margin-bottom: 30px;
        font-size: 16px;
        line-height: 1.5;
        color: rgb(48 58 80 / 50%);
      }
      button {
        width: 100%;
        height: 50px;
        border: 0;
        border-radius: 15px;
        background: #9fdfbf;
        color: #303a50;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>연결된 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도하기</button>
    </main>
  </body>
</html>
